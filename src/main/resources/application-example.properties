spring.application.name=backend

# MYSQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/revautohub
spring.datasource.username=your_username
spring.datasource.password=your_password

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Daraja Configuration (Example Values)
daraja.consumer-key=YOUR_CONSUMER_KEY
daraja.consumer-secret=YOUR_CONSUMER_SECRET
daraja.short-code=174379
daraja.passkey=YOUR_PASSKEY
daraja.callback-url=https://your-callback-url.com
daraja.account-reference=revautohub
daraja.transaction-desc=Payment for automotive product
daraja.oauth-url=https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
daraja.stk-push-url=https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest